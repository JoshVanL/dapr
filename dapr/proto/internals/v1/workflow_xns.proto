syntax = "proto3";

package dapr.proto.internals.v1;

option go_package = "github.com/dapr/dapr/pkg/proto/internals/v1;internals";

// WorkflowCrossNS bridges workflow operations between Dapr namespaces. The
// receiving daprd authenticates the SPIFFE peer, creates a durable receiving
// reminder keyed by ForwardOp.forward_id, and on its fire invokes the local
// workflow engine with the caller's identity preserved. The outbound side
// (the source app's xns actor) drives this RPC from its own durable reminder
// so the bridge is fully durable on both sides.
service WorkflowCrossNS {
  rpc ForwardOp(ForwardOpRequest) returns (ForwardOpResponse);
}

// WorkflowOpKind identifies which workflow operation the forward represents.
// The payload field carries the operation-specific marshalled request from
// durabletask-go (e.g. TerminateRequest, RaiseEventRequest, PurgeInstancesRequest).
enum WorkflowOpKind {
  WORKFLOW_OP_UNSPECIFIED = 0;
  WORKFLOW_OP_SCHEDULE = 1;
  WORKFLOW_OP_TERMINATE = 2;
  WORKFLOW_OP_RAISE = 3;
  WORKFLOW_OP_PAUSE = 4;
  WORKFLOW_OP_RESUME = 5;
  WORKFLOW_OP_PURGE = 6;
  WORKFLOW_OP_GET = 7;
  WORKFLOW_OP_RERUN = 8;
}

message ForwardOpRequest {
  // operation indicates which workflow operation to invoke on the receiving
  // side.
  WorkflowOpKind operation = 1;
  // instance_id is the workflow instance the operation applies to (or the
  // new instance ID for schedule).
  string instance_id = 2;
  // target_app_id is the app within the receiving namespace that hosts the
  // workflow. The receiving sidecar verifies this matches its own appID.
  string target_app_id = 3;
  // payload carries the marshalled durabletask request proto for the op.
  bytes payload = 4;
  // forward_id is a deterministic dedup key derived from (operation,
  // instance_id, target_app_id, target_app_namespace, payload). Both sides
  // use it to short-circuit duplicate forwards (e.g. after a reminder retry).
  string forward_id = 5;
  // target_app_namespace is the Dapr namespace hosting target_app_id. The
  // outbound forwarder uses it to dial the right peer daprd; the receiving
  // side verifies it matches.
  string target_app_namespace = 6;
}

// ForwardOpResponse returns the operation result back through the durable
// reminder on the source side. payload is the marshalled durabletask
// response proto for ops that return one (Get, Purge); empty for the rest.
message ForwardOpResponse {
  bytes payload = 1;
}
